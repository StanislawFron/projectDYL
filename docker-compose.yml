services:
    app:
        container_name: projectdyl-app
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: app
        volumes:
            - ./app:/var/www/app
            - ./config:/var/www/config
            - ./database:/var/www/database
            - ./resources:/var/www/resources
            - ./routes:/var/www/routes
            - ./tests:/var/www/tests
            - ./storage:/var/www/storage
            - ./composer.json:/var/www/composer.json
            - ./composer.lock:/var/www/composer.lock
            - ./.env:/var/www/.env:ro
            - ./.githooks:/var/www/.githooks:ro
        depends_on:
            mariadb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - projectDYL

    nginx:
        container_name: projectdyl-nginx
        image: nginx:alpine
        ports:
            - "8000:80"
        volumes:
            - ./public:/var/www/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - projectDYL

    mariadb:
        container_name: projectdyl-mariadb
        image: mariadb:10.9
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: laravel
        ports:
            - "3306:3306"
        volumes:
            - mariadb_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - projectDYL

volumes:
    mariadb_data:

networks:
    projectDYL:
        name: projectDYL
